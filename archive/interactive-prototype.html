<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173746">
<title>GEONARA — Earth Science Network</title>
<style>
:root{--ink:#173746;--teal:#55a99a;--sand:#d6b477;--bg:#f3f6f4;--paper:#fff;--muted:#73848a;--line:#e3ebe7;--soft:#eaf3ef;--red:#b94c4c;--shadow:0 12px 35px #183b4410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263e46;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:246px;background:var(--ink);color:#e9f1ee;display:flex;flex-direction:column;padding:22px 15px;flex-shrink:0}
.brand{display:flex;gap:11px;align-items:center;padding:3px 8px 26px}.logo{width:38px;height:38px;border-radius:12px;background:var(--teal);color:#12323a;font-weight:900;display:grid;place-items:center;font-size:21px}.brand b{font-size:19px;letter-spacing:1.4px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#a7c2bb;margin-top:3px}
.navgroup{font-size:9px;letter-spacing:1.7px;color:#91aaa6;padding:13px 11px 7px;text-transform:uppercase}.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#c5d4d0;padding:11px 12px;border-radius:9px;text-align:left;font-size:12px;margin:2px 0}.nav .ico{width:19px;text-align:center;color:#80c4b4;font-size:16px}.nav:hover,.nav.active{background:#2a505a;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid #42606a;padding:14px 8px 0;color:#9db3b0;font-size:10px;line-height:1.7}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.crumb{font-size:12px;color:#839196}.crumb b{color:var(--ink)}.topright{display:flex;align-items:center;gap:12px}.demo-pill{font-size:9px;color:#806638;background:#fbf3e5;border:1px solid #eadbbd;border-radius:30px;padding:6px 9px}.userchip{display:flex;align-items:center;gap:9px;font-size:11px}.avatar{width:33px;height:33px;border-radius:50%;background:#dcece6;color:#28685d;display:grid;place-items:center;font-weight:800}
.content{width:100%;max-width:1320px;margin:0 auto;padding:28px}.eyebrow{font-size:9px;letter-spacing:1.7px;font-weight:800;color:#4d9a8c;margin-bottom:8px}h1{font-size:26px;letter-spacing:-.6px;color:var(--ink);margin:0 0 7px}h2{font-size:16px;color:var(--ink);margin:0 0 5px}h3{font-size:13px;color:var(--ink);margin:0 0 6px}.sub{font-size:12px;color:var(--muted);line-height:1.65}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:23px}.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--ink);color:white;font-size:11px;font-weight:700}.btn:hover{background:#285562}.btn.teal{background:var(--teal);color:#15343a}.btn.light{background:#fff;color:#35545c;border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--red);border:1px solid #f1d5d2}.btn.small{padding:7px 10px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{grid-column:span 3}.stat .n{font-size:25px;font-weight:800;color:var(--ink);margin:9px 0 3px}.stat .cap{font-size:10px;color:var(--muted)}.stat .sym{font-size:18px;color:var(--teal)}.span8{grid-column:span 8}.span4{grid-column:span 4}.module{grid-column:span 4;display:flex;gap:12px;min-height:111px}.moduleicon{width:39px;height:39px;border-radius:11px;background:var(--soft);color:#398879;display:grid;place-items:center;font-size:18px;flex-shrink:0}.module p{font-size:10px;color:var(--muted);line-height:1.55;margin:0 0 9px}.textlink{border:0;background:none;padding:0;color:#398879;font-weight:750;font-size:10px}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ef}.rowitem:last-child{border-bottom:0}.rowitem strong{display:block;font-size:11px;color:#29444c;margin-bottom:4px}.rowitem small{font-size:9px;color:#829096}.tag{font-size:9px;padding:5px 8px;border-radius:20px;background:#edf5f2;color:#397b6f;white-space:nowrap}.tag.gold{background:#f8f1e5;color:#8a7043}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.search,.field{border:1px solid #dfe8e4;border-radius:8px;background:#fff;padding:10px 12px;font-size:11px;color:#29444d;outline:none}.search{flex:1;min-width:190px}.search:focus,.field:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #55a99a20}.chip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:7px 10px;font-size:9px;color:#61767b}.chip.active{background:#e7f2ee;border-color:#b7d8cc;color:#286b60}.termgrid,.researchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.term,.paper{border:1px solid var(--line);border-radius:11px;padding:15px;background:white}.term p,.paper p{font-size:10px;color:#74848a;line-height:1.65;margin:0}.term .eyebrow{margin-bottom:7px}.paper .meta{font-size:9px;color:#819096;margin:8px 0}.paper .paperfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.notice{background:#fbf5e9;border:1px solid #eddfc4;color:#78623d;padding:11px 13px;border-radius:9px;font-size:10px;line-height:1.6;margin-top:14px}.success{color:#2d796b;font-size:10px}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:#839196;font-size:11px}
.chat{border:1px solid var(--line);background:white;border-radius:13px;overflow:hidden;margin-top:17px}.chathead{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}.chatbody{height:350px;overflow:auto;background:#fbfcfb;padding:18px}.bubble{max-width:86%;padding:11px 13px;border-radius:11px;font-size:11px;line-height:1.7;margin-bottom:11px;white-space:pre-wrap}.bubble.bot{background:#edf4f1;color:#315056;border-top-left-radius:3px}.bubble.me{background:var(--ink);color:white;margin-left:auto;border-top-right-radius:3px}.chatcompose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chatcompose input{flex:1;min-width:0}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.messageslayout{display:grid;grid-template-columns:260px 1fr;gap:13px}.contact{display:flex;gap:9px;align-items:center;padding:11px 8px;border-bottom:1px solid #edf1ef;cursor:pointer;border-radius:8px}.contact.active,.contact:hover{background:#edf5f1}.contact b{font-size:10px;display:block}.contact small{font-size:9px;color:#829096}.thread{min-height:430px;display:flex;flex-direction:column}.threadbody{flex:1;min-height:300px;background:#fbfcfb;padding:16px;overflow:auto}.threadcompose{display:flex;gap:8px;border-top:1px solid var(--line);padding:11px}.profilehead{display:flex;gap:15px;align-items:center;padding:19px}.bigavatar{width:60px;height:60px;border-radius:17px;background:#e2eee9;color:#28685e;display:grid;place-items:center;font-size:21px;font-weight:800}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.formgroup{margin:10px 0}.formgroup label{display:block;font-size:10px;color:#73848a;margin-bottom:6px}.formgroup input,.formgroup textarea,.formgroup select{width:100%}.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.authvisual{background:linear-gradient(145deg,#173746,#24535d);color:white;padding:8vw;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.authvisual:after{content:"";position:absolute;width:430px;height:430px;border:1px solid #ffffff1d;border-radius:50%;right:-140px;bottom:-190px;box-shadow:0 0 0 45px #ffffff08,0 0 0 95px #ffffff06}.authvisual h1{color:white;font-size:38px;max-width:520px;line-height:1.15}.authvisual p{color:#c5d8d4;max-width:440px;font-size:13px;line-height:1.8}.authmain{display:grid;place-items:center;padding:30px}.authbox{width:min(390px,100%)}.authbox h2{font-size:22px;margin:0 0 7px}.authswitch{font-size:10px;color:#78898e;margin-top:17px}.authswitch button{border:0;background:none;color:#398879;font-weight:800}.authlogo{font-size:20px;letter-spacing:1.5px;font-weight:900;color:var(--ink);margin-bottom:35px}.autherror{font-size:10px;color:var(--red);margin-top:8px;min-height:15px}.hide{display:none!important}
@media(max-width:900px){.sidebar{width:70px;padding:16px 7px}.brand{padding:3px 8px 22px}.brand b,.brand small,.navgroup,.nav span:last-child,.sidefoot{display:none}.nav{justify-content:center;padding:12px 4px}.nav .ico{font-size:18px}.stat{grid-column:span 6}.span8,.span4{grid-column:span 12}.module{grid-column:span 6}.content{padding:21px}}
@media(max-width:620px){.authwrap{grid-template-columns:1fr}.authvisual{display:none}.topbar{padding:0 12px;height:58px}.content{padding:17px 11px}.welcome{display:block}.welcome .btn{margin-top:13px}h1{font-size:22px}.module{grid-column:span 12}.termgrid,.researchgrid{grid-template-columns:1fr}.messageslayout{grid-template-columns:1fr}.contactlist{display:flex;overflow:auto;gap:5px}.contact{min-width:135px;border:1px solid var(--line);padding:8px}.formgrid{grid-template-columns:1fr}.demo-pill{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{
const root=document.getElementById('root');
const KEY='geonara_demo_v1';
const seedTerms=[
['Sedimentology','Earth Sciences','The study of sediments, their origin, transport, deposition and post-depositional evolution.'],
['Stratigraphy','Geology','The study of rock layers, their sequence, distribution, correlation and chronological relationships.'],
['Diagenesis','Sedimentology','Physical, chemical and biological changes that affect sediments after deposition and during lithification.'],
['Porosity','Petrology','The proportion of void space in a rock or sediment relative to its total bulk volume.'],
['Permeability','Petroleum Geology','The capacity of a porous material to transmit fluids through connected pore spaces.'],
['Facies','Sedimentology','A body of rock with distinctive lithological, sedimentological or palaeontological characteristics.'],
['Lithology','Petrology','The physical description of a rock, including mineral composition, grain size, texture and colour.'],
['Unconformity','Stratigraphy','A surface representing a gap in the geological record caused by erosion or non-deposition.'],
['Sequence Stratigraphy','Stratigraphy','The analysis of genetically related sedimentary strata bounded by surfaces of stratigraphic significance.'],
['Diapirism','Structural Geology','The upward movement of relatively mobile material through denser overlying rocks.'],
['Alluvial Fan','Geomorphology','A fan-shaped sedimentary body deposited where a confined flow exits a mountain front or valley.'],
['Carbonate Platform','Sedimentology','A broad depositional system dominated by carbonate production and accumulation.'],
['Clastic Sediment','Sedimentology','Sediment composed of fragments derived from pre-existing rocks or minerals.'],
['Source Rock','Petroleum Geology','An organic-rich rock capable of generating hydrocarbons under suitable thermal conditions.'],
['Reservoir Rock','Petroleum Geology','A rock with sufficient effective porosity and permeability to store and transmit fluids.']
];
const papers=[
{title:'Sequence Stratigraphy and Sedimentary Basin Evolution',authors:'Demonstration record · Earth Sciences',year:2024,topic:'Stratigraphy',type:'Research article',abstract:'A sample record illustrating how sequence stratigraphic concepts can be organized for research discovery. This is placeholder metadata, not a verified publication.'},
{title:'Carbonate Reservoir Characterization: Methods and Challenges',authors:'Demonstration record · Petroleum Geoscience',year:2023,topic:'Petroleum Geology',type:'Review',abstract:'A sample overview of petrographic, petrophysical and geochemical approaches used in carbonate reservoir characterization.'},
{title:'Mineral Resources and Sustainable Exploration',authors:'Demonstration record · Economic Geology',year:2025,topic:'Mineral Resources',type:'Research article',abstract:'A sample research entry about mineral resource assessment, exploration workflows and environmental considerations.'},
{title:'Geochemical Signatures of Sedimentary Environments',authors:'Demonstration record · Geochemistry',year:2022,topic:'Geochemistry',type:'Research article',abstract:'A sample record describing the use of elemental and mineralogical proxies in interpreting depositional environments.'},
{title:'Clay Minerals in Sedimentary Systems',authors:'Demonstration record · Clay Science',year:2021,topic:'Mineralogy',type:'Review',abstract:'A placeholder summary of clay mineral formation, transformation and significance in sedimentary basins.'},
{title:'Geological Mapping and Remote Sensing Applications',authors:'Demonstration record · Applied Geology',year:2024,topic:'Applied Geology',type:'Research article',abstract:'A sample record showing how mapping, GIS and remote sensing topics may be categorized.'},
{title:'Palaeoenvironmental Reconstruction Using Fossil Assemblages',authors:'Demonstration record · Palaeontology',year:2020,topic:'Palaeontology',type:'Research article',abstract:'A placeholder record about integrating fossil evidence with sedimentological observations.'},
{title:'Silicate Weathering and the Long-Term Carbon Cycle',authors:'Demonstration record · Earth System Science',year:2025,topic:'Geochemistry',type:'Review',abstract:'A sample record illustrating links between mineral weathering, geochemistry and Earth-system processes.'}
];
const contacts=[{id:'mentor',name:'Dr. Lina Haddad',role:'Sedimentology researcher',initials:'LH'},{id:'colleague',name:'Yacine Benali',role:'Geologist',initials:'YB'},{id:'student',name:'Sarah Karim',role:'PhD candidate',initials:'SK'}];
const defaultState=()=>({users:[],current:null,profiles:{},messages:{mentor:[{from:'mentor',text:'Welcome to the GEONARA demo. This is a sample conversation to help you explore messaging.'}],colleague:[{from:'colleague',text:'Hello! Feel free to test the messaging experience here.'}],student:[]},savedPapers:[],language:'en'});
let state=load(),page='dashboard',activeContact='mentor';
function load(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return defaultState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function user(){return state.users.find(x=>x.email===state.current)}
function initials(name){return (name||'G').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function field(label,id,value,type='text'){return `<div class="formgroup"><label for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(value||'')}" required></div>`}
function auth(mode='login',error=''){root.innerHTML=`<div class="authwrap"><section class="authvisual"><div class="brand" style="padding:0 0 42px"><div class="logo">G</div><div><b style="letter-spacing:1.5px">GEONARA</b><small style="display:block;color:#a7c2bb;font-size:9px;letter-spacing:2px">EARTH SCIENCE NETWORK</small></div></div><div class="eyebrow" style="color:#8bd0c0">DISCOVER · CONNECT · UNDERSTAND</div><h1>A scientific space for people who study the Earth.</h1><p>Explore geological knowledge, discover research, exchange ideas and build your scientific profile in one connected workspace.</p><div style="font-size:10px;color:#9ebbb5;margin-top:32px">USER-FACING MVP · INTERACTIVE DEMONSTRATION</div></section><section class="authmain"><div class="authbox"><div class="authlogo">GEONARA</div><div class="eyebrow">${mode==='login'?'WELCOME BACK':'JOIN THE COMMUNITY'}</div><h2>${mode==='login'?'Sign in to your workspace':'Create your account'}</h2><div class="sub">${mode==='login'?'Access your scientific workspace and continue exploring.':'Set up a demo profile and explore the GEONARA experience.'}</div><form id="authform" style="margin-top:20px">${mode==='signup'?field('Full name','authname','','text'):''}${field('Email address','authemail','','email')}${field('Password','authpass','','password')}${mode==='signup'?field('Confirm password','authconfirm','','password'):''}<div class="autherror">${esc(error)}</div><button class="btn" style="width:100%;margin-top:8px">${mode==='login'?'Sign in':'Create demo account'}</button></form><div class="authswitch">${mode==='login'?"New to GEONARA?":"Already have an account?"} <button id="switchauth">${mode==='login'?'Create an account':'Sign in'}</button></div><div class="notice">Demo mode: accounts and profile data are stored only in this browser. Do not use a real password or sensitive personal information.</div></div></section></div>`;
$('#authform').addEventListener('submit',e=>{e.preventDefault();let email=$('#authemail').value.trim().toLowerCase(),pass=$('#authpass').value;if(mode==='signup'){let name=$('#authname').value.trim();if(pass.length<6)return auth(mode,'Use at least 6 characters for this demo password.');if(pass!==$('#authconfirm').value)return auth(mode,'The passwords do not match.');if(state.users.some(u=>u.email===email))return auth(mode,'An account with this email already exists in this browser.');state.users.push({name,email,password:pass});state.profiles[email]={name,title:'Geology enthusiast',specialization:'Earth Sciences',interests:'Geology, Earth Sciences',about:''};state.current=email;save();shell()}else{let found=state.users.find(u=>u.email===email&&u.password===pass);if(!found)return auth(mode,'Email or password is incorrect.');state.current=email;save();shell()}});
$('#switchauth').onclick=()=>auth(mode==='login'?'signup':'login');
}
function shell(){if(!user()){auth();return}root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">G</div><div><b>GEONARA</b><small>EARTH SCIENCE NETWORK</small></div></div><div class="navgroup">Workspace</div><button class="nav active" data-page="dashboard"><span class="ico">⌂</span><span>Overview</span></button><div class="navgroup">Explore</div><button class="nav" data-page="dictionary"><span class="ico">▤</span><span>Dictionary</span></button><button class="nav" data-page="research"><span class="ico">⌕</span><span>Research</span></button><button class="nav" data-page="ai"><span class="ico">✧</span><span>GEONARA AI</span></button><div class="navgroup">Community</div><button class="nav" data-page="messages"><span class="ico">▧</span><span>Messages</span></button><button class="nav" data-page="profile"><span class="ico">◎</span><span>My Profile</span></button><div class="sidefoot">GEONARA · MVP 1.0<br>Interactive demonstration</div></aside><main class="main"><header class="topbar"><div class="crumb">GEONARA <span style="color:#b7c2c0">/</span> <b id="crumb">Overview</b></div><div class="topright"><span class="demo-pill">DEMO ENVIRONMENT</span><div class="userchip"><div class="avatar" id="topavatar">${initials(user().name)}</div><span id="topname">${esc(user().name)}</span></div><button class="btn light small" id="logout">Sign out</button></div></header><section class="content" id="view"></section></main></div>`;
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logout').onclick=()=>{state.current=null;save();auth()};render()}
function go(p){page=p;root.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Overview',dictionary:'Dictionary',research:'Research',ai:'GEONARA AI',messages:'Messages',profile:'My Profile'})[p];render()}
function dashboard(){let p=state.profiles[state.current]||{};return `<div class="welcome"><div><div class="eyebrow">YOUR SCIENTIFIC WORKSPACE</div><h1>Welcome, ${esc((p.name||user().name).split(' ')[0])}.</h1><div class="sub">Explore geological knowledge, discover research and connect with the Earth science community.</div></div><button class="btn teal" data-go="ai">Ask GEONARA AI ↗</button></div><div class="grid"><div class="card stat"><div class="sym">▤</div><div class="n">${seedTerms.length}</div><div class="cap">Demo dictionary entries</div></div><div class="card stat"><div class="sym">⌕</div><div class="n">${papers.length}</div><div class="cap">Sample research records</div></div><div class="card stat"><div class="sym">✧</div><div class="n">AI</div><div class="cap">Interactive assistant demo</div></div><div class="card stat"><div class="sym">◎</div><div class="n">01</div><div class="cap">Your active demo profile</div></div><div class="card span8"><h2>Explore GEONARA</h2><div class="sub">Your main tools, connected in one scientific workspace.</div><div class="grid" style="margin-top:14px">${[['dictionary','▤','GEONARA Dictionary','Search key terms and explore concise geological definitions.'],['research','⌕','GEONARA Research','Search and filter sample research records by topic and year.'],['ai','✧','GEONARA AI','Ask geology questions and explore a guided demo response.'],['messages','▧','Direct Messaging','Exchange test messages with sample community members.'],['profile','◎','Professional Profile','Edit your name, specialization and research interests.']].map(x=>`<div class="card module"><div class="moduleicon">${x[1]}</div><div><h3>${x[2]}</h3><p>${x[3]}</p><button class="textlink" data-go="${x[0]}">Open module →</button></div></div>`).join('')}</div></div><div class="card span4"><h2>Continue exploring</h2><div class="sub">Quick entry points</div><div class="rowitem"><div><strong>Sequence Stratigraphy</strong><small>Dictionary · Stratigraphy</small></div><span class="tag">Term</span></div><div class="rowitem"><div><strong>Carbonate Reservoirs</strong><small>Research · Petroleum Geology</small></div><span class="tag">Topic</span></div><div class="rowitem"><div><strong>Ask a geology question</strong><small>GEONARA AI · Demo</small></div><span class="tag">AI</span></div><button class="textlink" data-go="dictionary">Browse dictionary →</button></div></div><div class="notice">You are using a local demonstration. Your demo account, profile edits and test messages are saved in this browser only. They are not visible to other users.</div>`}
function dictionary(){return `<div class="eyebrow">SCIENTIFIC KNOWLEDGE BASE</div><h1>GEONARA Dictionary</h1><div class="sub">Search geological terminology and explore concise definitions across Earth science disciplines.</div><div class="toolbar"><input class="search" id="termq" placeholder="Search terms or definitions..."><select class="field" id="termcat"><option value="">All disciplines</option>${[...new Set(seedTerms.map(t=>t[1]))].sort().map(x=>`<option>${x}</option>`).join('')}</select><span class="tag">${seedTerms.length} terms</span></div><div class="termgrid" id="termresults">${termCards(seedTerms)}</div><div class="notice">Dictionary entries are demonstration content for interface testing. A production release requires expert editorial review, source references, versioning and reviewed translations.</div>`}
function termCards(arr){return arr.length?arr.map(t=>`<article class="term"><div class="eyebrow">${esc(t[1])}</div><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p></article>`).join(''):'<div class="empty">No matching terms. Try another search.</div>'}
function research(){return `<div class="eyebrow">LITERATURE DISCOVERY</div><h1>GEONARA Research</h1><div class="sub">Explore a sample research catalogue. Search by title, topic or keyword and filter by publication year.</div><div class="toolbar"><input class="search" id="paperq" placeholder="Search research records..."><select class="field" id="papertopic"><option value="">All topics</option>${[...new Set(papers.map(p=>p.topic))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select class="field" id="paperyear"><option value="">Any year</option>${[...new Set(papers.map(p=>p.year))].sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="researchgrid" id="paperresults">${paperCards(papers)}</div><div class="notice">All records are illustrative placeholders, not verified publications. No external research provider or DOI service is connected. Live integration with sources such as OpenAlex, Crossref or Zenodo requires API implementation and provider-policy review.</div>`}
function paperCards(arr){return arr.length?arr.map((p,i)=>`<article class="paper"><div class="eyebrow">${esc(p.topic)} · ${p.year}</div><h3>${esc(p.title)}</h3><div class="meta">${esc(p.authors)} · ${esc(p.type)}</div><p>${esc(p.abstract)}</p><div class="paperfoot"><span class="tag gold">Sample record</span><button class="btn light small" data-savepaper="${esc(p.title)}">${state.savedPapers.includes(p.title)?'Saved ✓':'Save record'}</button></div></article>`).join(''):'<div class="empty">No records match these filters.</div>'}
function ai(){return `<div class="eyebrow">GEOLOGICAL KNOWLEDGE ASSISTANT</div><h1>GEONARA AI</h1><div class="sub">Try a geology question and explore the assistant interaction.</div><div class="chat"><div class="chathead"><div class="moduleicon">✧</div><div><h3 style="margin:0">GEONARA Scientific Assistant</h3><div class="muted" style="font-size:9px">Geology · Sedimentology · Earth Sciences</div></div><span class="tag gold" style="margin-left:auto">Simulation</span></div><div class="chatbody" id="aibody"><div class="bubble bot">Welcome to GEONARA AI. I can demonstrate how a geology-focused assistant might respond.\n\nTry one of the suggested questions below.</div></div><div class="chatcompose"><input class="field" id="aiq" placeholder="Ask a geological question..."><button class="btn" id="aisend">Send ↗</button></div></div><div class="suggestions"><button class="chip" data-prompt="What is the difference between porosity and permeability?">Porosity vs permeability</button><button class="chip" data-prompt="Explain the main principles of stratigraphy.">Principles of stratigraphy</button><button class="chip" data-prompt="What is a sedimentary facies?">Sedimentary facies</button></div><div class="notice">Important: this assistant is a rule-based demonstration, not a connected language model. It does not access scientific databases and its responses must not be treated as verified scientific advice. A production AI requires a secure provider connection, retrieval/citations, evaluation and usage controls.</div>`}
function aiAnswer(q){let s=q.toLowerCase();if(s.includes('porosity')||s.includes('permeability'))return 'Porosity is the fraction of a rock’s bulk volume occupied by voids. Permeability describes how readily fluids can move through connected pores. They are related but not equivalent: a rock can have significant porosity yet low permeability when pore throats are narrow or poorly connected. This is a concise educational summary; real samples require petrophysical measurements.';if(s.includes('stratigraph'))return 'Core stratigraphic principles include superposition, original horizontality, lateral continuity, cross-cutting relationships and faunal succession. They help establish relative chronology and correlate geological units. Their application must account for deformation, unconformities and local geological context.';if(s.includes('facies'))return 'A sedimentary facies is a body of rock characterized by a distinctive combination of lithology, sedimentary structures, texture, fossils and other attributes. Facies analysis uses these characteristics to interpret depositional processes and environments. Interpretations should be supported by field relationships and stratigraphic context.';if(s.includes('diagen'))return 'Diagenesis comprises the physical, chemical and biological processes that modify sediments after deposition and during lithification. Common processes include compaction, cementation, dissolution and mineral transformation. Their effects influence porosity and permeability.';if(s.includes('basalt')||s.includes('weather'))return 'Silicate weathering involves chemical reactions between minerals, water and atmospheric or soil CO₂. The rate and products depend on mineralogy, grain size, temperature, water availability and solution chemistry. Quantifying its contribution requires mineralogical and geochemical measurements.';return 'This question has been received by the GEONARA demonstration assistant. A production version would route it to a configured AI model, apply geological domain instructions, retrieve relevant scientific sources and provide traceable citations. For this preview, no external AI service is connected. Try asking about porosity, permeability, stratigraphy, facies or diagenesis.'}
function messages(){return `<div class="eyebrow">SCIENTIFIC COMMUNITY</div><h1>Direct Messaging</h1><div class="sub">Test a private conversation interface with sample community profiles.</div><div class="messageslayout" style="margin-top:17px"><div class="card"><h2>Conversations</h2><div class="contactlist">${contacts.map(c=>`<div class="contact ${activeContact===c.id?'active':''}" data-contact="${c.id}"><div class="avatar">${c.initials}</div><div><b>${c.name}</b><small>${c.role}</small></div></div>`).join('')}</div></div><div class="card thread"><div class="chathead" style="padding:0 0 12px"><div class="avatar">${contacts.find(c=>c.id===activeContact).initials}</div><div><h3 style="margin:0">${contacts.find(c=>c.id===activeContact).name}</h3><div class="muted" style="font-size:9px">${contacts.find(c=>c.id===activeContact).role}</div></div><span class="tag gold" style="margin-left:auto">Sample contact</span></div><div class="threadbody" id="threadbody">${threadMessages()}</div><div class="threadcompose"><input class="field" id="msginput" placeholder="Write a demo message..."><button class="btn" id="sendmsg">Send</button></div></div></div><div class="notice">Messages are stored locally in this browser and are not transmitted to another person. Sample contacts are fictional demo profiles. Real-time messaging requires authenticated backend services, WebSocket infrastructure, moderation and privacy controls.</div>`}
function threadMessages(){let a=state.messages[activeContact]||[];return a.map(m=>`<div class="bubble ${m.from==='me'?'me':'bot'}">${esc(m.text)}</div>`).join('')||'<div class="empty">No messages yet. Send a message to test the interface.</div>'}
function profile(){let p=state.profiles[state.current]||{};return `<div class="eyebrow">MEMBER PROFILE</div><h1>My Profile & Settings</h1><div class="sub">Manage the information shown in your local demo profile.</div><div class="card profilehead" style="margin-top:17px"><div class="bigavatar">${initials(p.name||user().name)}</div><div><h2>${esc(p.name||user().name)}</h2><div class="sub">${esc(p.title||'GEONARA member')} · ${esc(p.specialization||'Earth Sciences')}</div><span class="tag" style="display:inline-block;margin-top:7px">Demo member</span></div></div><form id="profileform" class="card" style="margin-top:13px"><h2>Professional information</h2><div class="formgrid">${field('Full name','pname',p.name||user().name)}${field('Professional title','ptitle',p.title||'')}${field('Specialization','pspec',p.specialization||'')}${field('Research interests','pinterests',p.interests||'')}</div><div class="formgroup"><label for="pabout">About</label><textarea id="pabout" class="field" rows="4" style="width:100%;resize:vertical">${esc(p.about||'')}</textarea></div><div class="formgroup"><label for="plang">Interface language preference</label><select id="plang" class="field"><option value="en">English (preview default)</option><option value="fr">Français (preference only)</option><option value="ar">العربية (preference only)</option></select></div><button class="btn">Save profile changes</button> <span id="profilesaved" class="success"></span></form><div class="card" style="margin-top:13px"><h2>Demo data controls</h2><div class="sub">Resetting removes this browser’s GEONARA demo account, saved records and test conversations.</div><button class="btn danger small" id="resetdemo" style="margin-top:12px">Reset demo data</button></div><div class="notice">This is local profile storage only. There is no server account, email verification, secure password handling, cloud synchronization or production privacy system.</div>`}
function render(){let v=$('#view');v.innerHTML=({dashboard,dictionary,research,ai,messages,profile})[page]();v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
if(page==='dictionary'){let apply=()=>{let q=$('#termq').value.toLowerCase(),c=$('#termcat').value;$('#termresults').innerHTML=termCards(seedTerms.filter(t=>(!c||t[1]===c)&&t.join(' ').toLowerCase().includes(q)))};$('#termq').oninput=apply;$('#termcat').onchange=apply}
if(page==='research'){let apply=()=>{let q=$('#paperq').value.toLowerCase(),t=$('#papertopic').value,y=$('#paperyear').value;let filtered=papers.filter(p=>(!t||p.topic===t)&&(!y||String(p.year)===y)&&Object.values(p).join(' ').toLowerCase().includes(q));$('#paperresults').innerHTML=paperCards(filtered);bindSave()};$('#paperq').oninput=apply;$('#papertopic').onchange=apply;$('#paperyear').onchange=apply;bindSave()}
if(page==='ai'){let send=()=>{let q=$('#aiq').value.trim();if(!q)return;let body=$('#aibody');body.insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(q)}</div><div class="bubble bot">${esc(aiAnswer(q))}</div>`);$('#aiq').value='';body.scrollTop=body.scrollHeight};$('#aisend').onclick=send;$('#aiq').onkeydown=e=>{if(e.key==='Enter')send()};v.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#aiq').value=b.dataset.prompt;send()})}
if(page==='messages'){v.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{activeContact=b.dataset.contact;render()});let send=()=>{let val=$('#msginput').value.trim();if(!val)return;(state.messages[activeContact]??=[]).push({from:'me',text:val});save();$('#threadbody').innerHTML=threadMessages();$('#msginput').value='';$('#threadbody').scrollTop=$('#threadbody').scrollHeight};$('#sendmsg').onclick=send;$('#msginput').onkeydown=e=>{if(e.key==='Enter')send()}}
if(page==='profile'){$('#profileform').onsubmit=e=>{e.preventDefault();state.profiles[state.current]={name:$('#pname').value.trim(),title:$('#ptitle').value.trim(),specialization:$('#pspec').value.trim(),interests:$('#pinterests').value.trim(),about:$('#pabout').value.trim()};state.language=$('#plang').value;save();$('#profilesaved').textContent='Profile saved in this browser.';$('#topname').textContent=state.profiles[state.current].name;$('#topavatar').textContent=initials(state.profiles[state.current].name)};$('#resetdemo').onclick=()=>{if(confirm('Delete this local demo account and all GEONARA demo data from this browser?')){localStorage.removeItem(KEY);state=defaultState();auth()}}}
}
function bindSave(){root.querySelectorAll('[data-savepaper]').forEach(b=>b.onclick=()=>{let title=b.dataset.savepaper;if(!title)return;state.savedPapers=state.savedPapers.includes(title)?state.savedPapers.filter(x=>x!==title):[...state.savedPapers,title];save();b.textContent=state.savedPapers.includes(title)?'Saved ✓':'Save record';})}
function $(s){return root.querySelector(s)}
if(state.current&&user())shell();else auth();
})();
</script>
</body></html>
